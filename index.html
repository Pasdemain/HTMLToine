<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>HTMLToine - Cyber Castle Defense</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a14; font-family: 'Segoe UI', Roboto, sans-serif; color: #e8f0ff; touch-action: none; }
  #game { position: fixed; inset: 0; display: flex; flex-direction: column; height: 100dvh; }
  #topBar { display: flex; justify-content: space-around; align-items: center; padding: 8px 6px; padding-top: calc(8px + env(safe-area-inset-top)); background: linear-gradient(180deg, #1a1530 0%, #0d0a1f 100%); border-bottom: 2px solid #4af; box-shadow: 0 0 12px #4af6; z-index: 5; }
  .stat { display: flex; flex-direction: column; align-items: center; font-size: 11px; letter-spacing: 1px; color: #8af; text-transform: uppercase; }
  .stat b { font-size: 18px; color: #fff; text-shadow: 0 0 6px currentColor; }
  .stat.hp b { color: #f55; }
  .stat.gold b { color: #fc3; }
  .stat.wave b { color: #5fa; }
  #canvas { flex: 1; display: block; touch-action: none; image-rendering: crisp-edges; min-height: 0; }
  #controls { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #0a0a18; border-top: 1px solid #4af6; min-height: 48px; }
  #controls .left, #controls .center, #controls .right { display: flex; gap: 6px; align-items: center; }
  #controls .center { flex: 1; justify-content: center; }
  #controls button { padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; letter-spacing: 0.5px; }
  #controls button:active { transform: scale(0.95); }
  #controls button.hidden { display: none; }
  #waveBtn { background: linear-gradient(180deg, #5fa 0%, #283 100%); color: #022; box-shadow: 0 0 10px #5fa6; }
  #sellBtn { background: linear-gradient(180deg, #f66 0%, #822 100%); color: #fff; box-shadow: 0 0 10px #f666; }
  #upgradeBtn { background: linear-gradient(180deg, #fc3 0%, #850 100%); color: #100; box-shadow: 0 0 10px #fc36; }
  #upgradeBtn:disabled { opacity: 0.5; }
  #meteorBtn { background: linear-gradient(180deg, #f80 0%, #520 100%); color: #fff; border: 2px solid #fc6 !important; border-radius: 50px !important; padding: 8px 16px !important; box-shadow: 0 0 12px #f808; }
  #meteorBtn.armed { background: linear-gradient(180deg, #fc3 0%, #f60 100%); animation: pulse 0.6s infinite alternate; }
  #meteorBtn.cooling { opacity: 0.5; }
  #wavePreview { display: flex; gap: 3px; align-items: center; padding: 4px 6px; background: rgba(20,16,40,0.85); border: 1px solid #4af6; border-radius: 6px; font-size: 13px; }
  #wavePreview.hidden { display: none; }
  #wavePreview .lbl { font-size: 9px; color: #8af; letter-spacing: 1px; text-transform: uppercase; margin-right: 2px; }
  @keyframes pulse { from { box-shadow: 0 0 12px #f80; } to { box-shadow: 0 0 24px #fc6; } }
  #shop { display: flex; gap: 6px; padding: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); padding-left: calc(8px + env(safe-area-inset-left)); padding-right: calc(8px + env(safe-area-inset-right)); background: linear-gradient(0deg, #1a1530 0%, #0d0a1f 100%); border-top: 2px solid #4af; box-shadow: 0 0 12px #4af6; z-index: 5; }
  .tower { flex: 1; padding: 8px 4px; background: #1c1838; border: 2px solid #345; border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.15s; position: relative; }
  .tower:active { transform: scale(0.95); }
  .tower.selected { border-color: #4af; background: #2a3870; box-shadow: 0 0 14px #4af; }
  .tower.locked { opacity: 0.5; }
  .tower .icon { font-size: 22px; line-height: 1; margin-bottom: 4px; }
  .tower .name { font-size: 10px; font-weight: bold; letter-spacing: 0.5px; }
  .tower .cost { font-size: 11px; color: #fc3; margin-top: 2px; }
  #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 18px 28px; background: rgba(10,10,30,0.95); border: 2px solid #4af; border-radius: 12px; text-align: center; box-shadow: 0 0 30px #4af; z-index: 10; max-width: 80%; }
  #msg h1 { font-size: 22px; color: #4af; margin-bottom: 8px; text-shadow: 0 0 10px #4af; }
  #msg p { font-size: 13px; margin-bottom: 12px; line-height: 1.5; color: #cde; }
  #msg button { padding: 10px 22px; font-size: 14px; font-weight: bold; background: linear-gradient(180deg, #4af 0%, #26a 100%); color: #fff; border: none; border-radius: 6px; cursor: pointer; letter-spacing: 1px; }
  #msg button:active { transform: scale(0.96); }
  #msg.hidden { display: none; }
  #msg.wide { max-width: 95%; padding: 14px 16px; max-height: 90vh; overflow-y: auto; }
  .picker { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; max-height: 60vh; overflow-y: auto; }
  .pick-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: linear-gradient(135deg, #1a1838 0%, #0e0c25 100%); border: 2px solid #345; border-radius: 10px; cursor: pointer; text-align: left; transition: all 0.15s; }
  .pick-card:active { transform: scale(0.98); }
  .pick-card.selected { border-color: var(--c, #4af); box-shadow: 0 0 18px var(--c, #4af); background: linear-gradient(135deg, #2a2855 0%, #1a1838 100%); }
  .pick-card .pi { font-size: 32px; line-height: 1; flex-shrink: 0; }
  .pick-card .ptxt { flex: 1; }
  .pick-card .pname { font-size: 14px; font-weight: bold; color: var(--c, #4af); letter-spacing: 1px; }
  .pick-card .pdesc { font-size: 11px; color: #aab; margin-top: 3px; line-height: 1.35; }
  .stepLabel { font-size: 10px; letter-spacing: 2px; color: #4af; text-transform: uppercase; margin-bottom: 4px; }
  #goBtn { width: 100%; margin-top: 10px; padding: 12px !important; font-size: 15px !important; }
  #goBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #backBtn { background: transparent !important; color: #8af !important; padding: 6px !important; font-size: 11px !important; margin-top: 4px; box-shadow: none !important; }
  .meta { font-size: 11px; color: #8af; margin: 6px 0; letter-spacing: 0.5px; }
  .meta b { color: #fc3; }
  .achToast { position: fixed; top: calc(70px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-30px); display: flex; gap: 10px; padding: 10px 14px; background: linear-gradient(135deg, #2a2148 0%, #1a1530 100%); border: 2px solid #fc3; border-radius: 10px; box-shadow: 0 0 20px #fc36; z-index: 100; opacity: 0; transition: all 0.4s; max-width: 88%; pointer-events: none; }
  .achToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .achToast .ai { font-size: 28px; line-height: 1; align-self: center; }
  .achToast .al { font-size: 9px; letter-spacing: 2px; color: #fc3; text-transform: uppercase; }
  .achToast .an { font-size: 13px; font-weight: bold; color: #fff; margin-top: 2px; }
  .achToast .ad { font-size: 10px; color: #aab; margin-top: 2px; line-height: 1.3; }
  .achGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 8px 0; }
  .achCell { display: flex; gap: 6px; padding: 6px; background: #15102a; border: 1px solid #345; border-radius: 6px; align-items: center; }
  .achCell.locked { opacity: 0.35; }
  .achCell .ci { font-size: 18px; flex-shrink: 0; }
  .achCell .cn { font-size: 10px; color: #fff; font-weight: bold; line-height: 1.2; }
  .achCell .cd { font-size: 9px; color: #8af; line-height: 1.2; margin-top: 1px; }
  .achBtn { background: rgba(252,195,51,0.2) !important; color: #fc3 !important; border: 1px solid #fc3 !important; box-shadow: none !important; padding: 6px 10px !important; font-size: 11px !important; margin-top: 4px; width: 100%; }
  .testBtn { background: rgba(74,222,128,0.18) !important; color: #5fa !important; border: 1px solid #5fa !important; box-shadow: none !important; padding: 6px 10px !important; font-size: 11px !important; margin-top: 4px; width: 100%; }
  .enemyList { display: flex; flex-direction: column; gap: 5px; margin: 8px 0; max-height: 50vh; overflow-y: auto; }
  .enemyRow { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: #15102a; border: 1px solid #345; border-radius: 6px; }
  .enemyRow .ei { font-size: 22px; line-height: 1; min-width: 26px; text-align: center; }
  .enemyRow .en { flex: 1; font-size: 11px; font-weight: bold; color: #cef; }
  .enemyRow .cb { width: 28px; height: 28px; padding: 0; font-size: 16px; font-weight: bold; background: #2a2148; color: #fff; border: 1px solid #4af; border-radius: 5px; cursor: pointer; }
  .enemyRow .cb:active { transform: scale(0.9); }
  .enemyRow .cv { min-width: 30px; text-align: center; font-weight: bold; font-size: 14px; color: #fc3; }
  .enemyRow .clear { background: #520; color: #f88; border-color: #844; font-size: 11px; width: auto; padding: 0 8px; }
  .metaGrid { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; max-height: 55vh; overflow-y: auto; }
  .metaCell { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: linear-gradient(135deg, #1a1838 0%, #0e0c25 100%); border: 1px solid #345; border-radius: 8px; }
  .metaCell.owned { border-color: #5fa; background: linear-gradient(135deg, #1a3528 0%, #0c2418 100%); }
  .metaCell.locked { opacity: 0.55; }
  .metaCell .ci { font-size: 22px; flex-shrink: 0; min-width: 28px; text-align: center; }
  .metaCell .mt { flex: 1; min-width: 0; }
  .metaCell .cn { font-size: 12px; font-weight: bold; color: #fff; }
  .metaCell .cd { font-size: 10px; color: #aab; margin-top: 2px; line-height: 1.3; }
  .metaCell .mb { padding: 6px 10px; font-size: 11px; font-weight: bold; background: linear-gradient(180deg, #fc3 0%, #850 100%); color: #100; border: none; border-radius: 6px; cursor: pointer; flex-shrink: 0; }
  .metaCell .mb:disabled { background: #333; color: #777; cursor: not-allowed; }
  .metaCell .mb.owned { background: transparent; color: #5fa; padding: 6px 4px; }
  #speedBtn { position: absolute; top: calc(8px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); padding: 4px 10px; background: rgba(74,170,255,0.2); border: 1px solid #4af; border-radius: 4px; color: #cef; font-weight: bold; font-size: 12px; z-index: 6; cursor: pointer; }
  #speedBtn:active { transform: scale(0.95); }
  #camBtn { position: absolute; top: calc(8px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left)); padding: 4px 10px; background: rgba(255,200,80,0.18); border: 1px solid #fc6; border-radius: 4px; color: #fec; font-weight: bold; font-size: 12px; z-index: 6; cursor: pointer; }
  #camBtn:active { transform: scale(0.95); }
</style>
</head>
<body>

        ACHIEVEMENTS[id] = {

  if (G.wave < 10 || !G.run.character || !G.run.map || !G.run.difficulty) return;
  const id = `clear_${G.run.character}_${G.run.map}_${G.run.difficulty}`;

  const all = Object.entries(ACHIEVEMENTS).filter(([_, a]) => a.matrix);
  const got = all.every(([k]) => (G.best.achievements || {})[k]);

  if (!ACHIEVEMENTS[id]) return;

  showAchievementToast(id);
}

function isCardUnlocked(card) {
  if (!card.unlockedBy) return true;
  return !!(G.best.achievements || {})[card.unlockedBy];
}

const RARITY_COLOR = { common:'#8af', rare:'#a7f', epic:'#fc3' };
const RARITY_LABEL = { common:'Commun', rare:'Rare', epic:'Epique' };

function drawCardChoices() {
  const pool = CARDS.filter(c => isCardUnlocked(c) && (!c.available || c.available()));
  const target = (G.run.mods && G.run.mods.draftSize) || 3;
  const pick = [];
  while (pick.length < target && pool.length) {
    const w = pool.map(c => c.rarity === 'epic' ? 1 : c.rarity === 'rare' ? 3 : 5);
    const total = w.reduce((a,b) => a+b, 0);
    let r = Math.random() * total;
    let i = 0;
    while (r > w[i]) { r -= w[i]; i++; }
    pick.push(pool[i]);
    pool.splice(i, 1);
  }
  return pick;
}

const ADDITIVE_FIELDS = new Set(['goldPerWave','hpPerWave','teslaChainBonus','startGold','startHp']);
const REPLACE_FIELDS = new Set(['startTowerLevel','sellRatio','teslaUnlocked','startArcher','draftSize']);

function defaultMods() {
  return {
    towerDmgMul: 1, towerRangeMul: 1, upgradeCostMul: 1,
    enemyHpMul: 1, goldMul: 1, xpMul: 1, globalRateMul: 1,
    startTowerLevel: 1, startHpMul: 1, teslaUnlocked: false,
    towerTypeDmgMul: { archer:1, laser:1, plasma:1, tesla:1 },
    towerTypeRateMul: { archer:1, laser:1, plasma:1, tesla:1 },
    plasmaAoeMul: 1, teslaChainBonus: 0,
    meteorCostMul: 1, meteorDmgMul: 1, meteorRadiusMul: 1,
    sellRatio: 0.6, goldPerWave: 0, hpPerWave: 0,
    startGold: 0, startHp: 0, startArcher: false, draftSize: 3
  };
}

function applyMods(...sources) {
  const out = defaultMods();
  for (const src of sources) {
    if (!src) continue;
    for (const k of Object.keys(src)) {
      const sv = src[k];
      if (typeof sv === 'number' && typeof out[k] === 'number') {
        if (k.endsWith('Mul')) out[k] *= sv;
        else if (ADDITIVE_FIELDS.has(k)) out[k] += sv;
        else out[k] = sv;
      } else if (sv && typeof sv === 'object' && out[k] && typeof out[k] === 'object') {
        for (const kk of Object.keys(sv)) {
          out[k][kk] = (out[k][kk] || 1) * sv[kk];
        }
      } else {
        out[k] = sv;
      }
    }
  }
  return out;
}

// ===== Layout =====
function layout() {
  const c = G.canvas;
  const rect = c.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  G.dpr = dpr;
  c.width  = Math.floor(rect.width * dpr);
  c.height = Math.floor(rect.height * dpr);
  G.ctx.setTransform(dpr,0,0,dpr,0,0);
  G.w = rect.width; G.h = rect.height;
  // map-specific dimensions
  const map = MAPS[G.map] || MAPS.donjon;
  COLS = map.cols || BASE_COLS;
  ROWS = map.rows || BASE_ROWS;
  // cell size always sized from BASE so large maps overflow
  G.cell = Math.min(G.w / BASE_COLS, G.h / BASE_ROWS);
  G.ox = (G.w - G.cell * COLS) / 2;
  G.oy = (G.h - G.cell * ROWS) / 2;
  resetCamera();
  G.pathsPx = map.paths.map(path => path.map(p => ({
    x: G.ox + (p.c + 0.5) * G.cell,
    y: G.oy + (p.r + 0.5) * G.cell
  })));
  computePathCells();
}

function resetCamera() {
  // auto-fit camera so the whole field is initially visible
  const fieldW = G.cell * COLS;
  const fieldH = G.cell * ROWS;
  const fitX = G.w / fieldW;
  const fitY = G.h / fieldH;
  const fit = Math.min(1, fitX, fitY);
  G.cam.minScale = Math.min(0.4, fit * 0.85);
  G.cam.scale = G.cam.defaultScale = fit;
  // center the field in the viewport
  G.cam.x = (G.w - fieldW * fit) / 2 - G.ox * fit;
  G.cam.y = (G.h - fieldH * fit) / 2 - G.oy * fit;
}

function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }

function clampCamera() {
  G.cam.scale = clamp(G.cam.scale, G.cam.minScale, G.cam.maxScale);
  // keep at least half of the field within the viewport
  const fieldW = G.cell * COLS * G.cam.scale;
  const fieldH = G.cell * ROWS * G.cam.scale;
  const fx = G.ox * G.cam.scale + G.cam.x;
  const fy = G.oy * G.cam.scale + G.cam.y;
  const margin = 80;
  if (fx + fieldW < margin) G.cam.x = margin - fieldW - G.ox * G.cam.scale;
  if (fy + fieldH < margin) G.cam.y = margin - fieldH - G.oy * G.cam.scale;
  if (fx > G.w - margin) G.cam.x = G.w - margin - G.ox * G.cam.scale;
  if (fy > G.h - margin) G.cam.y = G.h - margin - G.oy * G.cam.scale;
}

function screenToWorld(sx, sy) {
  return { x: (sx - G.cam.x) / G.cam.scale, y: (sy - G.cam.y) / G.cam.scale };
}

function zoomAt(sx, sy, factor) {
  const newScale = clamp(G.cam.scale * factor, G.cam.minScale, G.cam.maxScale);
  if (newScale === G.cam.scale) return;
  const wx = (sx - G.cam.x) / G.cam.scale;
  const wy = (sy - G.cam.y) / G.cam.scale;
  G.cam.scale = newScale;
  G.cam.x = sx - wx * newScale;
  G.cam.y = sy - wy * newScale;
  clampCamera();
}

function computePathCells() {
  G.pathCells = new Set();
  const map = MAPS[G.map] || MAPS.donjon;
  for (const path of map.paths) {
    for (let i = 0; i < path.length - 1; i++) {
      const a = path[i], b = path[i+1];
      const dc = Math.sign(b.c - a.c), dr = Math.sign(b.r - a.r);
      let c = a.c, r = a.r;
      while (c !== b.c || r !== b.r) {
        if (c >= 0 && c < COLS && r >= 0 && r < ROWS) G.pathCells.add(c+','+r);
        c += dc; r += dr;
      }
      if (b.c >= 0 && b.c < COLS && b.r >= 0 && b.r < ROWS) G.pathCells.add(b.c+','+b.r);
    }
  }
}

function cellAt(sx, sy) {
  const w = screenToWorld(sx, sy);
  const c = Math.floor((w.x - G.ox) / G.cell);
  const r = Math.floor((w.y - G.oy) / G.cell);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return null;
  return { c, r };
}
function cellCenter(c, r) {
  return { x: G.ox + (c + 0.5) * G.cell, y: G.oy + (r + 0.5) * G.cell };
}
function isPath(c, r) { return G.pathCells.has(c+','+r); }
function isOccupied(c, r) { return G.occupied.has(c+','+r); }

// ===== Enemy =====
class Enemy {
  constructor(type, hpMul, pathIdx) {
    const t = ENEMY_TYPES[type];
    this.type = type;
    this.pathIdx = pathIdx || 0;
    this.maxHp = t.hp * hpMul * G.run.mods.enemyHpMul;
    this.hp = this.maxHp;
    this.speed = t.speed;
    this.gold = t.gold;
    this.color = t.color;
    this.size = t.size;
    this.seg = 0;
    this.t = 0;
    const path = G.pathsPx[this.pathIdx] || G.pathsPx[0];
    this.x = path[0].x;
    this.y = path[0].y;
    this.dead = false;
    this.reached = false;
    this.flash = 0;
    this.slow = 0;
    this.ability = t.ability || null;
    this.shield = (this.ability === 'shield') ? this.maxHp * 0.6 : 0;
    this.maxShield = this.shield;
    this.healTimer = 0;
    this.healPulse = 0;
  }
  path() { return G.pathsPx[this.pathIdx] || G.pathsPx[0]; }
  update(dt) {
    if (this.dead || this.reached) return;
    if (this.flash > 0) this.flash -= dt;
    if (this.healPulse > 0) this.healPulse -= dt;
    if (this.ability === 'heal') {
      this.healTimer += dt;
      if (this.healTimer >= 1.0) {
        this.healTimer = 0;
        this.healPulse = 0.4;
        const r = G.cell * 1.6;
        for (const e of G.enemies) {
          if (e === this || e.dead || e.reached) continue;
          if (Math.hypot(e.x - this.x, e.y - this.y) > r) continue;
          e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.05 + 4);
        }
      }
    }
    let speed = this.speed;
    if (this.slow > 0) { speed *= 0.5; this.slow -= dt; }
    let remaining = speed * dt;
    const p = this.path();
    while (remaining > 0 && this.seg < p.length - 1) {
      const a = p[this.seg], b = p[this.seg + 1];
      const segLen = Math.hypot(b.x - a.x, b.y - a.y) / G.cell;
      const stepLen = remaining;
      const newT = this.t + stepLen / segLen;
      if (newT >= 1) {
        remaining -= (1 - this.t) * segLen;
        this.seg++;
        this.t = 0;
      } else {
        this.t = newT;
        remaining = 0;
      }
    }
    if (this.seg >= p.length - 1) {
      this.reached = true;
      G.hp--;
      spawnParticles(this.x, this.y, '#f55', 8);
      return;
    }
    const a = p[this.seg], b = p[this.seg + 1];
    this.x = a.x + (b.x - a.x) * this.t;
    this.y = a.y + (b.y - a.y) * this.t;
  }
  damage(d) {
    if (this.dead) return;
    G.stats.dmgDealt += d;
    if (this.shield > 0) {
      const absorbed = Math.min(this.shield, d);
      this.shield -= absorbed;
      d -= absorbed;
      if (this.shield <= 0) spawnParticles(this.x, this.y, '#fff', 8);
      if (d <= 0) { this.flash = 0.1; return; }
    }
    this.hp -= d;
    this.flash = 0.1;
    if (this.hp <= 0) {
      this.dead = true;
      const earned = Math.floor(this.gold * G.run.mods.goldMul);
      G.gold += earned;
      G.stats.goldEarned += earned;
      G.stats.kills++;
      const baseXp = (this.type === 'boss') ? 50 : 1;
      G.run.runXp = (G.run.runXp || 0) + Math.ceil(baseXp * G.run.mods.xpMul);
      spawnParticles(this.x, this.y, this.color, 10);
      if (this.ability === 'split') {
        for (let i = 0; i < 2; i++) {
          const mini = new Enemy('mini', 1, this.pathIdx);
          mini.seg = this.seg;
          mini.t = this.t;
          mini.x = this.x + (i ? G.cell*0.2 : -G.cell*0.2);
          mini.y = this.y;
          G.enemies.push(mini);
        }
      }
    }
  }
  draw(ctx) {
    const r = this.size * G.cell;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(this.x, this.y + r*0.6, r*0.8, r*0.3, 0, 0, Math.PI*2); ctx.fill();
    // body
    ctx.fillStyle = this.flash > 0 ? '#fff' : this.color;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    if (this.type === 'drone') {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i/6)*Math.PI*2 + G.time*2;
        const px = this.x + Math.cos(a)*r, py = this.y + Math.sin(a)*r;
        i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (this.type === 'knight') {
      ctx.fillRect(this.x-r, this.y-r, r*2, r*2);
      ctx.strokeRect(this.x-r, this.y-r, r*2, r*2);
      ctx.fillStyle = '#f55'; ctx.fillRect(this.x-r*0.4, this.y-r*0.5, r*0.8, r*0.3);
    } else if (this.type === 'boss') {
      ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff0';
      for (let i = 0; i < 5; i++) {
        const a = (i/5)*Math.PI*2 - Math.PI/2 + G.time;
        ctx.beginPath();
        ctx.arc(this.x+Math.cos(a)*r*0.6, this.y+Math.sin(a)*r*0.6, r*0.15, 0, Math.PI*2);
        ctx.fill();
      }
    } else if (this.type === 'shield') {
      ctx.beginPath(); ctx.arc(this.x, this.y, r*0.7, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      if (this.shield > 0) {
        ctx.strokeStyle = '#5fa'; ctx.lineWidth = 3;
        ctx.shadowColor = '#5fa'; ctx.shadowBlur = 8;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = (i/6)*Math.PI*2 + G.time;
          const px = this.x + Math.cos(a)*r, py = this.y + Math.sin(a)*r;
          i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
        }
        ctx.closePath(); ctx.stroke();
        ctx.shadowBlur = 0;
      }
    } else if (this.type === 'healer') {
      if (this.healPulse > 0) {
        ctx.strokeStyle = '#5fa';
        ctx.shadowColor = '#5fa'; ctx.shadowBlur = 14;
        ctx.lineWidth = 2 + this.healPulse * 8;
        ctx.beginPath(); ctx.arc(this.x, this.y, G.cell * 1.6 * (1 - this.healPulse * 1.5), 0, Math.PI*2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
      ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.fillRect(this.x - r*0.5, this.y - 1, r, 2);
      ctx.fillRect(this.x - 1, this.y - r*0.5, 2, r);
    } else if (this.type === 'splitter') {
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const a = (i/4)*Math.PI*2 + Math.PI/4;
        const px = this.x + Math.cos(a)*r, py = this.y + Math.sin(a)*r;
        i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (this.type === 'mini') {
      ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    }
    // hp bar (and shield bar if any)
    const bw = r * 2, bh = 4;
    ctx.fillStyle = '#400'; ctx.fillRect(this.x - bw/2, this.y - r - 8, bw, bh);
    ctx.fillStyle = '#5f5'; ctx.fillRect(this.x - bw/2, this.y - r - 8, bw * (this.hp/this.maxHp), bh);
    if (this.maxShield > 0) {
      ctx.fillStyle = '#022'; ctx.fillRect(this.x - bw/2, this.y - r - 14, bw, 3);
      ctx.fillStyle = '#5fa'; ctx.fillRect(this.x - bw/2, this.y - r - 14, bw * (this.shield/this.maxShield), 3);
    }
  }
}

// ===== Wave System =====
const WAVES = [
  ['goblin','goblin','goblin','goblin','goblin'],
  ['goblin','goblin','goblin','knight','goblin','knight'],
  ['drone','drone','drone','drone','goblin','goblin'],
  ['shield','knight','goblin','goblin','knight','goblin'],
  ['drone','drone','healer','knight','drone','knight'],
  ['ogre','splitter','goblin','goblin'],
  ['drone','shield','drone','drone','drone','drone','shield'],
  ['knight','knight','healer','knight','ogre','knight'],
  ['ogre','splitter','splitter','drone','drone','knight'],
  ['boss','shield','healer','knight','knight','splitter']
];

function generateEndlessWave(n) {
  const pool = ['goblin','goblin','knight','drone','knight','ogre'];
  if (n >= 1) pool.push('shield');
  if (n >= 3) pool.push('healer');
  if (n >= 4) pool.push('splitter');
  const out = [];
  const count = 6 + Math.floor(n * 0.7);
  for (let i = 0; i < count; i++) {
    out.push(pool[Math.floor(Math.random() * pool.length)]);
  }
  if (n % 5 === 0) out.push('boss');
  if (n > 3 && Math.random() < 0.4) out.push('ogre');
  if (n >= 2) out.push('shield');
  return out;
}

function getWave(idx) {
  if (idx < WAVES.length) return WAVES[idx];
  return generateEndlessWave(idx - WAVES.length + 1);
}

function startWave() {
  if (G.spawnQueue.length || (G.spawnBatches && G.spawnBatches.length) || G.enemies.length) return;
  // test mode: only one wave, then back to setup
  if (G.run.testMode) {
    if (G.wave >= 1) { showTestSetup(); return; }
    const pathCount = (MAPS[G.map] || MAPS.donjon).paths.length;
    G.spawnQueue = [];
    G.spawnBatches = buildInterleavedBatches(G.run.testWave || [], pathCount, 10);
    G.spawnTimer = 0;
    G.wave++;
    G.run._waveStartHp = G.hp;
    document.getElementById('waveBtn').classList.add('hidden');
    document.getElementById('wavePreview').classList.add('hidden');
    return;
  }
  const w = getWave(G.wave);
  const hpMul = 1 + G.wave * 0.18;
  const pathCount = (MAPS[G.map] || MAPS.donjon).paths.length;
  G.spawnQueue = w.map((t, i) => ({ type:t, hpMul, pathIdx: i % pathCount }));
  G.spawnTimer = 0;
  G.wave++;
  // start-of-wave bonuses (after wave 1+)
  if (G.wave > 1) {
    if (G.run.mods.goldPerWave) G.gold += G.run.mods.goldPerWave;
    if (G.run.mods.hpPerWave) G.hp += G.run.mods.hpPerWave;
  }
  G.run._waveStartHp = G.hp;
  document.getElementById('waveBtn').classList.add('hidden');
  document.getElementById('wavePreview').classList.add('hidden');
}

function updateWavePreview() {
  const el = document.getElementById('wavePreview');
  if (G.spawnQueue.length || (G.spawnBatches && G.spawnBatches.length) || G.enemies.length || !G.running || G.gameOver) {
    el.classList.add('hidden');
    return;
  }
  const next = getWave(G.wave);
  const counts = {};
  for (const t of next) counts[t] = (counts[t] || 0) + 1;
  const ICONS = { goblin:'\u{1F47A}', knight:'\u{1F6E1}', drone:'\u{1F6F8}', ogre:'\u{1F479}', boss:'\u{1F47F}',
                  shield:'\u{1F6E1}\u{FE0F}', healer:'\u{2695}\u{FE0F}', splitter:'\u{1F48E}', mini:'\u{1F539}' };
  let html = '<span class="lbl">Suivant</span>';
  for (const [k, n] of Object.entries(counts)) {
    html += `<span class="pe" title="${k}">${ICONS[k]||'?'}${n>1?'×'+n:''}</span>`;
  }
  el.innerHTML = html;
  el.classList.remove('hidden');
}

function buildInterleavedBatches(typeList, pathCount, ticks) {
  // count per type
  const counts = {};
  for (const t of typeList) counts[t] = (counts[t] || 0) + 1;
  const types = Object.keys(counts);
  const cumulative = {};
  for (const t of types) cumulative[t] = 0;
  const pathByType = {};
  for (const t of types) pathByType[t] = 0;
  const batches = [];
  for (let i = 1; i <= ticks; i++) {
    const batch = [];
    for (const t of types) {
      const target = Math.round(i / ticks * counts[t]);
      const toSpawn = target - cumulative[t];
      for (let j = 0; j < toSpawn; j++) {
        const pi = pathByType[t] % pathCount;
        pathByType[t]++;
        batch.push({ type: t, hpMul: 1, pathIdx: pi });
      }
      cumulative[t] = target;
    }
    // shuffle within batch so types don't always appear in same order
    for (let k = batch.length - 1; k > 0; k--) {
      const r = Math.floor(Math.random() * (k + 1));
      [batch[k], batch[r]] = [batch[r], batch[k]];
    }
    if (batch.length) batches.push(batch);
  }
  return batches;
}

function updateSpawning(dt) {
  if (G.spawnBatches && G.spawnBatches.length) {
    G.spawnTimer -= dt;
    if (G.spawnTimer <= 0) {
      const batch = G.spawnBatches.shift();
      for (const s of batch) G.enemies.push(new Enemy(s.type, s.hpMul, s.pathIdx || 0));
      G.spawnTimer = 0.1;
    }
    return;
  }
  if (!G.spawnQueue.length) return;
  G.spawnTimer -= dt;
  while (G.spawnTimer <= 0 && G.spawnQueue.length) {
    const s = G.spawnQueue.shift();
    G.enemies.push(new Enemy(s.type, s.hpMul, s.pathIdx || 0));
    G.spawnTimer += G.run.testMode ? 0.1 : 0.7;
  }
}

// ===== Tower =====
class Tower {
  constructor(c, r, type) {
    this.c = c; this.r = r; this.type = type;
    const def = TOWER_TYPES[type];
    this.def = def;
    const center = cellCenter(c, r);
    this.x = center.x; this.y = center.y;
    this.range = def.range * G.cell * G.run.mods.towerRangeMul;
    this.cooldown = 0;
    this.angle = -Math.PI/2;
    this.level = G.run.mods.startTowerLevel || 1;
    this.totalCost = def.cost;
    this.fireFlash = 0;
    // apply level-from-mod range boost retroactively
    for (let i = 1; i < this.level; i++) this.range *= 1.15;
  }
  upgradeCost() { return Math.floor(this.def.cost * (1 + this.level * 0.8) * G.run.mods.upgradeCostMul); }
  sellValue() { return Math.floor(this.totalCost * (G.run.mods.sellRatio || 0.6)); }
  upgrade() {
    const cost = this.upgradeCost();
    if (G.gold < cost || this.level >= 3) return false;
    G.gold -= cost;
    this.totalCost += cost;
    this.level++;
    this.range *= 1.15;
    if (this.level >= 3) triggerAchievement('tower_lvl3');
    return true;
  }
  effDmg() {
    const m = G.run.mods;
    return this.def.dmg * (1 + (this.level - 1) * 0.6) * m.towerDmgMul *
      (m.towerTypeDmgMul[this.type] || 1);
  }
  effRate() {
    const m = G.run.mods;
    const tMul = m.towerTypeRateMul[this.type] || 1;
    const gMul = m.globalRateMul || 1;
    return this.def.rate * Math.pow(0.85, this.level - 1) / (tMul * gMul);
  }
  findTarget() {
    let best = null, bestScore = -1;
    for (const e of G.enemies) {
      if (e.dead || e.reached) continue;
      const dx = e.x - this.x, dy = e.y - this.y;
      if (dx*dx + dy*dy > this.range*this.range) continue;
      // prefer enemies further along their path (closer to castle)
      const total = (e.path().length - 1) || 1;
      const score = (e.seg + e.t) / total;
      if (score > bestScore) { bestScore = score; best = e; }
    }
    return best;
  }
  update(dt) {
    if (this.fireFlash > 0) this.fireFlash -= dt;
    this.cooldown -= dt;
    const tgt = this.findTarget();
    if (tgt) {
      this.angle = Math.atan2(tgt.y - this.y, tgt.x - this.x);
      if (this.cooldown <= 0) {
        this.fire(tgt);
        this.cooldown = this.effRate();
      }
    }
  }
  fire(tgt) {
    this.fireFlash = 0.1;
    const dmg = this.effDmg();
    if (this.type === 'laser') {
      tgt.damage(dmg);
      G.projectiles.push(new Beam(this.x, this.y, tgt.x, tgt.y, this.def.proj));
    } else if (this.type === 'tesla') {
      const hit = new Set([tgt]);
      let cur = tgt, prev = { x:this.x, y:this.y };
      const chain = this.def.chain + (this.level - 1) + (G.run.mods.teslaChainBonus || 0);
      let killCount = 0;
      for (let i = 0; i < chain; i++) {
        if (!cur) break;
        const wasAlive = !cur.dead;
        cur.damage(dmg);
        if (wasAlive && cur.dead) killCount++;
        G.projectiles.push(new Beam(prev.x, prev.y, cur.x, cur.y, this.def.proj, true));
        prev = cur;
        cur = G.enemies.find(e => !e.dead && !e.reached && !hit.has(e) &&
          Math.hypot(e.x - prev.x, e.y - prev.y) < G.cell * 1.8);
        if (cur) hit.add(cur);
      }
      if (killCount >= 4) triggerAchievement('tesla_4kill');
    } else {
      const aoe = (this.def.aoe || 0) * (this.def.aoe ? G.run.mods.plasmaAoeMul : 1);
      G.projectiles.push(new Projectile(this.x, this.y, tgt, this.def.proj, dmg, aoe));
    }
  }
  draw(ctx) {
    const s = G.cell * 0.4;
    // base
    ctx.fillStyle = '#333a55';
    ctx.strokeStyle = this.def.color;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(this.x, this.y, s + 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    // turret
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.fillStyle = this.def.color;
    ctx.fillRect(-2, -3, s + 6, 6);
    ctx.fillRect(-s*0.5, -s*0.5, s, s);
    if (this.fireFlash > 0) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s+4, 0, 4, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
    // level pips
    for (let i = 0; i < this.level; i++) {
      ctx.fillStyle = '#ff5';
      ctx.beginPath(); ctx.arc(this.x - s + i*5, this.y - s - 6, 2, 0, Math.PI*2); ctx.fill();
    }
  }
}

// ===== Projectile =====
class Projectile {
  constructor(x, y, target, color, dmg, aoe) {
    this.x = x; this.y = y; this.target = target;
    this.color = color; this.dmg = dmg; this.aoe = aoe;
    this.speed = 12 * G.cell; this.dead = false;
  }
  update(dt) {
    if (this.target.dead || this.target.reached) {
      const dx = this.target.x - this.x, dy = this.target.y - this.y;
      const d = Math.hypot(dx, dy);
      if (d < 6) { this.dead = true; return; }
    }
    const dx = this.target.x - this.x, dy = this.target.y - this.y;
    const d = Math.hypot(dx, dy);
    const step = this.speed * dt;
    if (d <= step) {
      this.hit();
    } else {
      this.x += dx/d * step; this.y += dy/d * step;
    }
  }
  hit() {
    this.dead = true;
    if (this.aoe > 0) {
      const r = this.aoe * G.cell;
      for (const e of G.enemies) {
        if (e.dead || e.reached) continue;
        if (Math.hypot(e.x - this.x, e.y - this.y) <= r) e.damage(this.dmg);
      }
      spawnParticles(this.x, this.y, this.color, 14);
    } else {
      this.target.damage(this.dmg);
      spawnParticles(this.x, this.y, this.color, 5);
    }
  }
  draw(ctx) {
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }
}

class Beam {
  constructor(x1, y1, x2, y2, color, jitter) {
    this.x1=x1; this.y1=y1; this.x2=x2; this.y2=y2;
    this.color = color; this.life = 0.15; this.jitter = jitter;
  }
  update(dt) { this.life -= dt; if (this.life <= 0) this.dead = true; }
  draw(ctx) {
    ctx.strokeStyle = this.color;
    ctx.shadowColor = this.color; ctx.shadowBlur = 10;
    ctx.lineWidth = 2 + this.life * 10;
    ctx.beginPath();
    if (this.jitter) {
      ctx.moveTo(this.x1, this.y1);
      const segs = 5;
      for (let i = 1; i < segs; i++) {
        const t = i/segs;
        const x = this.x1 + (this.x2-this.x1)*t + (Math.random()-0.5)*8;
        const y = this.y1 + (this.y2-this.y1)*t + (Math.random()-0.5)*8;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(this.x2, this.y2);
    } else {
      ctx.moveTo(this.x1, this.y1); ctx.lineTo(this.x2, this.y2);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

// ===== Meteor Spell =====
class Meteor {
  constructor(tx, ty) {
    this.tx = tx; this.ty = ty;
    this.x = tx + 200; this.y = -100;
    this.t = 0; this.duration = 0.6; this.dead = false;
    this.exploded = false;
  }
  update(dt) {
    this.t += dt;
    const k = Math.min(1, this.t / this.duration);
    this.x = (this.tx + 200) + (this.tx - (this.tx + 200)) * k;
    this.y = -100 + (this.ty - (-100)) * k;
    if (k >= 1 && !this.exploded) {
      this.exploded = true;
      const r = METEOR_RADIUS * G.cell * (G.run.mods.meteorRadiusMul || 1);
      const dmg = METEOR_DMG * G.run.mods.meteorDmgMul;
      let kc = 0;
      for (const e of G.enemies) {
        if (e.dead || e.reached) continue;
        if (Math.hypot(e.x - this.tx, e.y - this.ty) <= r) {
          const wasAlive = !e.dead;
          e.damage(dmg);
          e.slow = 1.0;
          if (wasAlive && e.dead) kc++;
        }
      }
      if (kc >= 5) triggerAchievement('meteor_5kill');
      spawnParticles(this.tx, this.ty, '#f80', 30);
      spawnParticles(this.tx, this.ty, '#fc3', 20);
      this.dead = true;
    }
  }
  draw(ctx) {
    ctx.strokeStyle = '#f80'; ctx.lineWidth = 2;
    ctx.shadowColor = '#f80'; ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(this.x + 30, this.y - 30);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();
    ctx.fillStyle = '#fc3';
    ctx.beginPath(); ctx.arc(this.x, this.y, 10, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function effectiveMeteorCost() {
  return Math.max(10, Math.floor(METEOR_COST * (G.run.mods.meteorCostMul || 1)));
}

function castMeteor(x, y) {
  const cost = effectiveMeteorCost();
  if (G.gold < cost) return;
  G.gold -= cost;
  G.projectiles.push(new Meteor(x, y));
  G.meteorAiming = false;
  document.getElementById('meteorBtn').classList.remove('armed');
  spawnParticles(x, y, '#f80', 6);
}

// ===== Particles =====
function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 30 + Math.random() * 80;
    G.particles.push({
      x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.5 + Math.random() * 0.4, color
    });
  }
}
function updateParticles(dt) {
  for (const p of G.particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life -= dt;
  }
  G.particles = G.particles.filter(p => p.life > 0);
}
function drawParticles(ctx) {
  for (const p of G.particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function getEventPos(e) {
  const rect = G.canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}

function onTap(x, y) {
  // Meteor aiming mode intercepts taps on canvas
  if (G.meteorAiming) {
    castMeteor(x, y);
    return;
  }
  const cell = cellAt(x, y);
  if (!cell) return;
  // tap existing tower → select
  const existing = G.towers.find(t => t.c === cell.c && t.r === cell.r);
  if (existing) {
    G.selectedTower = (G.selectedTower === existing) ? null : existing;
    G.selectedType = null;
    updateShopUI();
    updateTowerButtons();
    return;
  }
  // place new tower
  if (G.selectedType) {
    if (isPath(cell.c, cell.r) || isOccupied(cell.c, cell.r)) return;
    const def = TOWER_TYPES[G.selectedType];
    if (G.gold < def.cost) return;
    G.gold -= def.cost;
    const tower = new Tower(cell.c, cell.r, G.selectedType);
    G.towers.push(tower);
    G.occupied.add(cell.c+','+cell.r);
    G.stats.towersBuilt++;
    spawnParticles(tower.x, tower.y, def.color, 12);
    updateShopUI();
    return;
  }
  // deselect
  G.selectedTower = null;
  updateTowerButtons();
}

function updateTowerButtons() {
  const sell = document.getElementById('sellBtn');
  const up = document.getElementById('upgradeBtn');
  const t = G.selectedTower;
  if (!t) {
    sell.classList.add('hidden');
    up.classList.add('hidden');
    return;
  }
  sell.textContent = `VENDRE (${t.sellValue()})`;
  sell.classList.remove('hidden');
  if (t.level >= 3) {
    up.classList.add('hidden');
  } else {
    up.classList.remove('hidden');
    up.textContent = `LVL ${t.level+1} (${t.upgradeCost()})`;
    up.disabled = G.gold < t.upgradeCost();
  }
}

function setupInput() {
  const c = G.canvas;
  let ts = null;
  const TAP_PX = 10;
  function pos(t, rect) { return { x: t.clientX - rect.left, y: t.clientY - rect.top }; }
  function pinchInfo(touches, rect) {
    const a = pos(touches[0], rect), b = pos(touches[1], rect);
    return { dist: Math.hypot(a.x-b.x, a.y-b.y), cx:(a.x+b.x)/2, cy:(a.y+b.y)/2 };
  }
  c.addEventListener('touchstart', e => {
    e.preventDefault();
    const rect = c.getBoundingClientRect();
    if (e.touches.length === 1) {
      const p = pos(e.touches[0], rect);
      ts = { type:'pan', sx:p.x, sy:p.y, camX:G.cam.x, camY:G.cam.y, moved:false };
      G.hoverCell = cellAt(p.x, p.y);
    } else if (e.touches.length >= 2) {
      const pi = pinchInfo(e.touches, rect);
      ts = { type:'pinch', startDist:pi.dist, startScale:G.cam.scale,
             startCx:pi.cx, startCy:pi.cy, camX:G.cam.x, camY:G.cam.y };
      G.hoverCell = null;
    }
  }, { passive: false });
  c.addEventListener('touchmove', e => {
    e.preventDefault();
    const rect = c.getBoundingClientRect();
    if (!ts) return;
    if (ts.type === 'pan' && e.touches.length === 1) {
      const p = pos(e.touches[0], rect);
      const dx = p.x - ts.sx, dy = p.y - ts.sy;
      if (!ts.moved && Math.hypot(dx, dy) > TAP_PX) { ts.moved = true; G.hoverCell = null; }
      if (ts.moved) {
        G.cam.x = ts.camX + dx;
        G.cam.y = ts.camY + dy;
        clampCamera();
      } else {
        G.hoverCell = cellAt(p.x, p.y);
      }
    } else if (ts.type === 'pinch' && e.touches.length >= 2) {
      const pi = pinchInfo(e.touches, rect);
      const ratio = pi.dist / ts.startDist;
      const newScale = clamp(ts.startScale * ratio, G.cam.minScale, G.cam.maxScale);
      const wx = (ts.startCx - ts.camX) / ts.startScale;
      const wy = (ts.startCy - ts.camY) / ts.startScale;
      G.cam.scale = newScale;
      G.cam.x = pi.cx - wx * newScale;
      G.cam.y = pi.cy - wy * newScale;
      clampCamera();
    }
  }, { passive: false });
  c.addEventListener('touchend', e => {
    e.preventDefault();
    if (ts && ts.type === 'pan' && !ts.moved) onTap(ts.sx, ts.sy);
    if (e.touches.length === 0) { ts = null; G.hoverCell = null; }
    else if (e.touches.length === 1) {
      const rect = c.getBoundingClientRect();
      const p = pos(e.touches[0], rect);
      ts = { type:'pan', sx:p.x, sy:p.y, camX:G.cam.x, camY:G.cam.y, moved:true };
    }
  }, { passive: false });
  c.addEventListener('mousedown', e => {
    const rect = c.getBoundingClientRect();
    const p = pos(e, rect);
    G.hoverCell = cellAt(p.x, p.y);
    onTap(p.x, p.y);
  });
  c.addEventListener('mousemove', e => {
    const rect = c.getBoundingClientRect();
    const p = pos(e, rect);
    G.hoverCell = cellAt(p.x, p.y);
  });
  c.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = c.getBoundingClientRect();
    const p = pos(e, rect);
    zoomAt(p.x, p.y, e.deltaY > 0 ? 0.9 : 1.1);
  }, { passive: false });

  document.getElementById('waveBtn').addEventListener('click', () => {
    if (!G.running) return;
    startWave();
  });

  document.getElementById('sellBtn').addEventListener('click', () => {
    if (!G.selectedTower) return;
    const t = G.selectedTower;
    G.gold += t.sellValue();
    G.occupied.delete(t.c+','+t.r);
    G.towers = G.towers.filter(x => x !== t);
    spawnParticles(t.x, t.y, '#fc3', 10);
    G.selectedTower = null;
    updateTowerButtons();
    updateShopUI();
  });

  document.getElementById('upgradeBtn').addEventListener('click', () => {
    if (!G.selectedTower) return;
    if (G.selectedTower.upgrade()) {
      spawnParticles(G.selectedTower.x, G.selectedTower.y, '#fc3', 14);
      updateTowerButtons();
      updateShopUI();
    }
  });

  document.getElementById('speedBtn').addEventListener('click', () => {
    G.speed = G.speed === 1 ? 2 : G.speed === 2 ? 3 : 1;
    document.getElementById('speedBtn').textContent = G.speed + 'x';
  });

  document.getElementById('camBtn').addEventListener('click', () => {
    resetCamera();
  });

  document.getElementById('meteorBtn').addEventListener('click', () => {
    if (!G.running) return;
    if (G.gold < effectiveMeteorCost()) return;
    G.meteorAiming = !G.meteorAiming;
    document.getElementById('meteorBtn').classList.toggle('armed', G.meteorAiming);
  });

  // (startBtn removed; new run flow uses showTitle → showCharSelect → showDiffSelect → startRun)

  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 200));
}

function buyMetaNode(id) {
  const n = META_NODES[id];

  G.best.unlocks[id] = Date.now();
  G.best.spentXp = (G.best.spentXp || 0) + n.cost;
  saveBest();
  spawnParticles(G.w/2, G.h/2, '#fc3', 24);
  showMetaTree();
}

    <h1>CHOISIS TON HEROS</h1>
    <div class="picker">${cards}</div>
    <button id="goBtn" ${G.run.character ? '' : 'disabled'}>SUIVANT</button>
    <button id="backBtn">← Retour</button>
  `;
  m.classList.remove('hidden');
  for (const el of m.querySelectorAll('.pick-card')) {
    el.onclick = () => { G.run.character = el.dataset.char; showCharSelect(); };
  }
  document.getElementById('goBtn').onclick = () => G.run.character && showMapSelect();
  document.getElementById('backBtn').onclick = showTitle;
}

function showMapSelect() {
  G.screen = 'mapSelect';
  const m = document.getElementById('msg');
  m.classList.add('wide');
  let cards = '';
  for (const [k, mp] of Object.entries(MAPS)) {
    if (mp.testOnly) continue;
    const sel = G.run.map === k ? 'selected' : '';
    const spawns = mp.paths.length;
    const sizeBadge = mp.large
      ? `<span style="font-size:9px;color:#fc6;background:#420;padding:1px 4px;border-radius:3px;margin-left:4px">GRANDE</span>`
      : '';
    cards += `
      <div class="pick-card ${sel}" data-map="${k}" style="--c:#4af">
        <div class="pi">${mp.icon}</div>
        <div class="ptxt">
          <div class="pname">${mp.name} <span style="font-size:9px;color:#8af">${spawns} entree${spawns>1?'s':''}</span>${sizeBadge}</div>
          <div class="pdesc">${mp.desc}</div>
        </div>
      </div>`;
  }
  m.innerHTML = `
    <div class="stepLabel">2 / 3 — Carte</div>
    <h1>CHOISIS LA CARTE</h1>
    <div class="picker">${cards}</div>
    <button id="goBtn" ${G.run.map ? '' : 'disabled'}>SUIVANT</button>
    <button id="backBtn">← Retour</button>
  `;
  m.classList.remove('hidden');
  for (const el of m.querySelectorAll('.pick-card')) {
    el.onclick = () => { G.run.map = el.dataset.map; showMapSelect(); };
  }
  document.getElementById('goBtn').onclick = () => G.run.map && showDiffSelect();
  document.getElementById('backBtn').onclick = showCharSelect;
}

function showDiffSelect() {
  G.screen = 'diffSelect';
  const m = document.getElementById('msg');
  m.classList.add('wide');
  let cards = '';
  for (const [k, d] of Object.entries(DIFFICULTIES)) {
    const sel = G.run.difficulty === k ? 'selected' : '';
    cards += `
      <div class="pick-card ${sel}" data-diff="${k}" style="--c:${d.color}">
        <div class="pi" style="color:${d.color}">★</div>
        <div class="ptxt">
          <div class="pname">${d.name}</div>
          <div class="pdesc">${d.desc}</div>
        </div>
      </div>`;
  }
  m.innerHTML = `
    <div class="stepLabel">3 / 3 — Difficulte</div>
    <h1>CHOISIS LA DIFFICULTE</h1>
    <div class="picker">${cards}</div>
    <button id="goBtn" ${G.run.difficulty ? '' : 'disabled'}>LANCER LE RUN</button>
    <button id="backBtn">← Retour</button>
  `;
  m.classList.remove('hidden');
  for (const el of m.querySelectorAll('.pick-card')) {
    el.onclick = () => { G.run.difficulty = el.dataset.diff; showDiffSelect(); };
  }
  document.getElementById('goBtn').onclick = () => G.run.difficulty && startRun();
  document.getElementById('backBtn').onclick = showMapSelect;
}

function showCardDraft() {
  G.screen = 'cardDraft';
  G.running = false;
  const choices = drawCardChoices();
  G.run._currentChoices = choices;
  const m = document.getElementById('msg');
  m.classList.add('wide');
  let cards = '';
  for (let i = 0; i < choices.length; i++) {
    const c = choices[i];
    const col = RARITY_COLOR[c.rarity];
    cards += `
      <div class="pick-card card-choice" data-idx="${i}" style="--c:${col}">
        <div class="pi" style="color:${col}">${c.icon}</div>
        <div class="ptxt">
          <div class="pname">${c.name} <span style="font-size:9px;color:${col};opacity:0.8">${RARITY_LABEL[c.rarity]}</span></div>
          <div class="pdesc">${c.desc}</div>
        </div>
      </div>`;
  }
  m.innerHTML = `
    <div class="stepLabel">Vague ${G.wave} terminee</div>
    <h1>RECOMPENSE</h1>
    <div class="meta">Choisis une carte (1 / ${choices.length})</div>
    <div class="picker">${cards}</div>
  `;
  m.classList.remove('hidden');
  for (const el of m.querySelectorAll('.card-choice')) {
    el.onclick = () => pickCard(parseInt(el.dataset.idx, 10));
  }
}

function pickCard(idx) {
  const c = G.run._currentChoices[idx];
  c.apply();
  G.run.cardsTaken = G.run.cardsTaken || [];
  G.run.cardsTaken.push(c.id);
  triggerAchievement('first_card');
  if (G.run.cardsTaken.length >= 5) triggerAchievement('card_collector_5');
  if (G.run.cardsTaken.length >= 10) triggerAchievement('card_collector_10');
  document.getElementById('msg').classList.add('hidden');
  G.screen = 'playing';
  G.running = true;
  spawnParticles(G.w/2, G.h/2, RARITY_COLOR[c.rarity], 30);
  updateShopUI();
}

function startRun() {
  const char = CHARACTERS[G.run.character];
  const diff = DIFFICULTIES[G.run.difficulty];
  G.run.mods = applyMods(...metaModsCombined(), char.mods, diff.mods);
  G.run.testMode = false;
  G.run.cardsTaken = [];
  G.run.lastDraftWave = 0;
  G.run.runXp = 0;
  document.getElementById('waveBtn').textContent = 'VAGUE';
  // apply map
  G.map = G.run.map || 'donjon';
  // reset gameplay state
  G.enemies = []; G.towers = []; G.projectiles = []; G.particles = [];
  G.occupied.clear();
  G.spawnQueue = []; G.spawnBatches = []; G.wave = 0;
  layout();
  const m = G.run.mods;
  G.gold = Math.floor(120 * m.goldMul) + (m.startGold || 0);
  G.hp = Math.max(1, Math.floor(20 * m.startHpMul) + (m.startHp || 0));
  G.gameOver = false; G.victory = false;
  G.stats = { kills:0, goldEarned:0, towersBuilt:0, dmgDealt:0 };
  G.screen = 'playing';
  document.getElementById('msg').classList.add('hidden');
  G.running = true;
  document.getElementById('waveBtn').classList.remove('hidden');
  document.getElementById('meteorBtn').classList.remove('hidden');
  buildShop();
  updateShopUI();
  triggerAchievement('first_run');
  if (G.run.character === 'forgeron') triggerAchievement('played_forgeron');
  if (G.run.character === 'hacker') triggerAchievement('played_hacker');
  if (G.run.character === 'druide') triggerAchievement('played_druide');
  // place free archer if unlocked
  if (m.startArcher) placeFreeArcher();
}

function placeFreeArcher() {
  // find a free, non-path cell adjacent-ish to the path start
  const candidates = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (isPath(c, r) || isOccupied(c, r)) continue;
      candidates.push({ c, r });
    }
  }
  if (!candidates.length) return;
  const start = G.pathsPx[0][0];
  candidates.sort((a, b) => {
    const ca = cellCenter(a.c, a.r);
    const cb = cellCenter(b.c, b.r);
    return Math.hypot(ca.x - start.x, ca.y - start.y) -
           Math.hypot(cb.x - start.x, cb.y - start.y);
  });
  const { c, r } = candidates[0];
  const tower = new Tower(c, r, 'archer');
  G.towers.push(tower);
  G.occupied.add(c+','+r);
  G.stats.towersBuilt++;
  spawnParticles(tower.x, tower.y, '#cb8', 12);
}

function showRunSummary(victory) {
  const newRecord = G.wave > G.best.wave;
  const xpEarned = bankRunXp();
  saveBest();
  const xpAvail = metaXpAvailable();
  const lines = [
    `Le donjon est tombe a la vague ${G.wave}.`,
    `<br><br>Vague atteinte : <b>${G.wave}</b>${newRecord ? ' \u{1F3C6} NOUVEAU RECORD' : ''}`,
    `<br>Ennemis abattus : <b>${G.stats.kills}</b>`,
    `<br>Tours construites : <b>${G.stats.towersBuilt}</b>`,
    `<br>Or gagne : <b>${G.stats.goldEarned}</b>`,
    `<br>Cartes piochees : <b>${(G.run.cardsTaken || []).length}</b>`,
    `<br><br><span style="color:#fc3">XP gagne : <b>+${xpEarned}</b></span>`,
    `<br>XP disponible : <b>${xpAvail}</b>`
  ];
  showMessage('DEFAITE', lines.join(''), 'CONTINUER', showTitle);
}

// ===== Render =====
function drawSky(ctx) {
  const g = ctx.createLinearGradient(0, 0, 0, G.h);
  g.addColorStop(0, '#0e0a25');
  g.addColorStop(1, '#1a1840');
  ctx.fillStyle = g; ctx.fillRect(0, 0, G.w, G.h);
  ctx.fillStyle = '#ffffff20';
  for (let i = 0; i < 40; i++) {
    const x = (i * 137) % G.w;
    const y = (i * 271 + Math.sin(G.time + i) * 20) % G.h;
    ctx.fillRect(x, y, 1, 1);
  }
}

function drawField(ctx) {
  ctx.fillStyle = '#0c1428';
  ctx.fillRect(G.ox, G.oy, G.cell * COLS, G.cell * ROWS);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (isPath(c, r)) continue;
      const x = G.ox + c * G.cell, y = G.oy + r * G.cell;
      const shade = (c + r) % 2 ? '#15203a' : '#101a30';
      ctx.fillStyle = shade;
      ctx.fillRect(x, y, G.cell, G.cell);
      ctx.strokeStyle = '#1a2a48';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, G.cell - 1, G.cell - 1);
    }
  }
}

function applyWorldTransform() {
  G.ctx.setTransform(G.dpr * G.cam.scale, 0, 0, G.dpr * G.cam.scale,
                     G.dpr * G.cam.x, G.dpr * G.cam.y);
}
function applyScreenTransform() {
  G.ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
}

function drawPath(ctx) {
  // stone/circuit tiles (union of all paths)
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!isPath(c, r)) continue;
      const x = G.ox + c * G.cell, y = G.oy + r * G.cell;
      ctx.fillStyle = '#3a2c1a';
      ctx.fillRect(x, y, G.cell, G.cell);
      ctx.strokeStyle = '#5a4428';
      ctx.lineWidth = 2;
      ctx.strokeRect(x+1, y+1, G.cell-2, G.cell-2);
      ctx.strokeStyle = '#4afa';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + G.cell*0.2, y + G.cell*0.5);
      ctx.lineTo(x + G.cell*0.8, y + G.cell*0.5);
      ctx.moveTo(x + G.cell*0.5, y + G.cell*0.2);
      ctx.lineTo(x + G.cell*0.5, y + G.cell*0.8);
      ctx.stroke();
    }
  }
  // spawn portals (one per path)
  for (const path of G.pathsPx) {
    const start = path[0];
    ctx.save();
    ctx.translate(start.x, start.y);
    ctx.fillStyle = '#f0a';
    ctx.shadowColor = '#f0a'; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(0, 0, G.cell*0.3 + Math.sin(G.time*4)*2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  // castles
  const map = MAPS[G.map] || MAPS.donjon;
  const ends = map.castleEnds || (map.castleEnd ? [map.castleEnd] : [{c:8,r:12}]);
  for (const ce of ends) {
    const end = { x: G.ox + (ce.c + 0.5) * G.cell, y: G.oy + (ce.r + 0.5) * G.cell };
    ctx.save();
    ctx.translate(end.x, end.y);
    ctx.fillStyle = '#445';
    ctx.fillRect(-G.cell*0.5, -G.cell*0.7, G.cell, G.cell*0.9);
    ctx.fillStyle = '#667';
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(-G.cell*0.5 + i*G.cell*0.3, -G.cell*0.85, G.cell*0.18, G.cell*0.15);
    }
    ctx.fillStyle = '#4af';
    ctx.shadowColor = '#4af'; ctx.shadowBlur = 8;
    ctx.fillRect(-G.cell*0.1, -G.cell*0.4, G.cell*0.2, G.cell*0.3);
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

function drawHover(ctx) {
  if (!G.hoverCell || !G.selectedType) return;
  const { c, r } = G.hoverCell;
  const x = G.ox + c * G.cell, y = G.oy + r * G.cell;
  const valid = !isPath(c, r) && !isOccupied(c, r) && G.gold >= TOWER_TYPES[G.selectedType].cost;
  ctx.fillStyle = valid ? '#4f46' : '#f446';
  ctx.fillRect(x, y, G.cell, G.cell);
  if (valid) {
    const def = TOWER_TYPES[G.selectedType];
    const center = cellCenter(c, r);
    ctx.strokeStyle = def.color + '88';
    ctx.beginPath();
    ctx.arc(center.x, center.y, def.range * G.cell, 0, Math.PI*2);
    ctx.stroke();
  }
}

function drawSelectedRange(ctx) {
  if (!G.selectedTower) return;
  const t = G.selectedTower;
  ctx.strokeStyle = t.def.color;
  ctx.fillStyle = t.def.color + '22';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(t.x, t.y, t.range, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
}

function render() {
  const ctx = G.ctx;
  applyScreenTransform();
  ctx.clearRect(0, 0, G.w, G.h);
  drawSky(ctx);
  applyWorldTransform();
  drawField(ctx);
  drawPath(ctx);
  drawHover(ctx);
  drawSelectedRange(ctx);
  for (const t of G.towers) t.draw(ctx);
  for (const e of G.enemies) if (!e.dead && !e.reached) e.draw(ctx);
  for (const p of G.projectiles) p.draw(ctx);
  drawParticles(ctx);
  applyScreenTransform();
}

// ===== Main Loop =====
function update(dt) {
  if (!G.running) return;
  dt *= G.speed;
  G.time += dt;
  updateSpawning(dt);
  for (const t of G.towers) t.update(dt);
  for (const e of G.enemies) e.update(dt);
  for (const p of G.projectiles) p.update(dt);
  updateParticles(dt);
  G.enemies = G.enemies.filter(e => !e.dead && !e.reached);
  G.projectiles = G.projectiles.filter(p => !p.dead);
  // wave done? in endless mode, never auto-end
  const waveDone = !G.spawnQueue.length && !(G.spawnBatches && G.spawnBatches.length) && !G.enemies.length;
  if (waveDone) {
    document.getElementById('waveBtn').classList.remove('hidden');
    updateWavePreview();
    if (!G.run.testMode) {
      if (G.wave > 0 && G.run._waveStartHp != null && G.hp >= G.run._waveStartHp) {
        triggerAchievement('flawless_wave');
      }
      if (G.wave >= 5)  triggerAchievement('wave_5');
      if (G.wave >= 10) {
        triggerAchievement('wave_10');
        triggerMatrixCompletion();
      }
      if (G.wave >= 20) triggerAchievement('wave_20');
      if (G.wave >= 30) triggerAchievement('wave_30');
      if (G.wave > 0 && G.wave !== G.run.lastDraftWave && G.wave % 2 === 0) {
        G.run.lastDraftWave = G.wave;
        setTimeout(showCardDraft, 350);
      }
    } else if (G.wave >= 1) {
      // in test mode, after the single wave finishes show the wave button
      // (which will route back to setup via startWave)
      document.getElementById('waveBtn').textContent = 'RECONFIGURER';
    }
  }
  // game over: HP gone (skipped in test mode since HP is huge anyway)
  if (G.hp <= 0 && !G.gameOver && !G.run.testMode) {
    G.gameOver = true; G.running = false;
    if (G.wave >= 10) {
      if (G.run.difficulty === 'hard') triggerAchievement('hard_won');
      if (G.run.difficulty === 'nightmare') triggerAchievement('nightmare_won');
    }
    saveBest();
    showRunSummary(false);
  }
  // milestone notification at end of wave 10 (endless continues)
  if (waveDone && G.wave === WAVES.length && !G.victory && G.running) {
    G.victory = true;
    G.gold += 200;
    spawnParticles(G.w/2, G.h/2, '#5fa', 40);
  }
  // UI
  document.getElementById('hp').textContent = Math.max(0, G.hp);
  document.getElementById('gold').textContent = G.gold;
  const waveLbl = G.wave > WAVES.length ? `${G.wave} (∞)` : `${G.wave}/${WAVES.length}`;
  document.getElementById('wave').textContent = waveLbl;
  // meteor button affordance
  const mBtn = document.getElementById('meteorBtn');
  const mc = effectiveMeteorCost();
  mBtn.textContent = `METEOR (${mc})`;
  mBtn.classList.toggle('cooling', G.gold < mc);
  // gold milestones
  if (G.gold >= 500) triggerAchievement('rich_500');
  if (G.gold >= 1000) triggerAchievement('rich_1000');
  // upgrade button cost may need refresh (gold changed)
  if (G.selectedTower) updateTowerButtons();
  updateShopUI();
}

function loop(ts) {
  const t = ts / 1000;
  const dt = Math.min(0.05, t - (G.lastTime || t));
  G.lastTime = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// ===== Init =====
function init() {
  G.canvas = document.getElementById('canvas');
  G.ctx = G.canvas.getContext('2d');
  generateMatrixAchievements();
  layout();
  setupInput();
  loadBest();
  showTitle();
  requestAnimationFrame(loop);
}

window.addEventListener('load', init);
</script>
